[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "springboot-agent-rules-cli"
version = "0.1.0"
description = "CLI orchestrator for generating Spring Boot microservices from springboot-agent-rules"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
agent-rules = "agent_rules.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
