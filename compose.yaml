services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalPassw0rd!"
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalPassw0rd!' -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - tasks-sqlserver-data:/var/opt/mssql

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd
        -S sqlserver -U sa -P 'LocalPassw0rd!' -C
        -Q "IF DB_ID(N'tasks') IS NULL CREATE DATABASE tasks"
    restart: "no"

volumes:
  tasks-sqlserver-data:
