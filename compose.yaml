services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - tasks-postgres-data:/var/lib/postgresql

volumes:
  tasks-postgres-data:
