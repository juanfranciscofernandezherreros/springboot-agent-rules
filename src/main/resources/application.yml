spring:
  application:
    name: tasks
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=tasks;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:LocalPassw0rd!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  error:
    include-message: never
